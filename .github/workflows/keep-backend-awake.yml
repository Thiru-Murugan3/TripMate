name: Keep backend awake
# Render's free plan sleeps the API after ~15 idle minutes, so the next sign-in waits
# 1-3 minutes for a cold start. A light health ping every 10 minutes keeps it warm.
# One always-on free service fits inside Render's 750 free instance hours per month.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping API health
        run: |
          for attempt in 1 2 3; do
            if curl -fsS -m 120 https://tripmate-api-thiru-murugan3.onrender.com/api/v1/health; then exit 0; fi
            sleep 20
          done
          echo "::warning::Backend health check did not answer"
