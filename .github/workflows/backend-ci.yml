name: Backend CI
on:
  push:
    branches: [ main, development ]
    paths: [ "backend/**", ".github/workflows/backend-ci.yml" ]
  pull_request:
    branches: [ main, development ]
    paths: [ "backend/**" ]
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      tidb:
        image: pingcap/tidb:v8.5.3
        ports:
          - 3306:3306
    defaults:
      run:
        working-directory: backend
    env:
      MIGRATION_TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/test?useSSL=false&allowPublicKeyRetrieval=true
      MIGRATION_TEST_DB_USERNAME: root
      MIGRATION_TEST_DB_PASSWORD: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Wait for TiDB
        run: timeout 60 bash -c 'until (echo > /dev/tcp/127.0.0.1/3306) 2>/dev/null; do sleep 2; done'
      - run: mvn -B test
      - run: javac tools/FlywayV7Repair.java
