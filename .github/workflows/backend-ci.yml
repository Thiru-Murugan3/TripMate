name: Backend CI
on:
  push:
    branches: [ main, development ]
    paths: [ "backend/**", ".github/workflows/backend-ci.yml" ]
  pull_request:
    branches: [ main, development ]
    paths: [ "backend/**" ]
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: tripmate_ci_root
          MYSQL_DATABASE: tripmate_migration_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptripmate_ci_root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: backend
    env:
      MIGRATION_TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/tripmate_migration_ci?useSSL=false&allowPublicKeyRetrieval=true
      MIGRATION_TEST_DB_USERNAME: root
      MIGRATION_TEST_DB_PASSWORD: tripmate_ci_root
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B test
      - run: javac tools/FlywayV7Repair.java
