name: Android APK
on:
  workflow_dispatch:
  pull_request:
    branches: [development, main]
    paths: ['mobile/**', 'web/**', '.github/workflows/android-apk.yml']
  push:
    branches: [development]
    paths: ['mobile/**', 'web/**', '.github/workflows/android-apk.yml']
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: npm ci
        working-directory: web
      - name: Install native build dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
        working-directory: mobile
      - run: npm test
        working-directory: mobile
      - run: npm run test:native
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npm run prepare:web
        working-directory: mobile
        env:
          MOBILE_API_BASE: ${{ vars.SUTTRU_MOBILE_API_BASE || 'https://tripmate-api-thiru-murugan3.onrender.com' }}
      - run: npm run android:sync
        working-directory: mobile
      - run: npm run android:apk
        working-directory: mobile
      - uses: actions/upload-artifact@v4
        with:
          name: Suttru-Android-debug
          path: mobile/dist/Suttru-debug.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: Suttru-Android-build-dependencies
          path: mobile/package-lock.json
          retention-days: 14
