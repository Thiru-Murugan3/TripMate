spring:
  application:
    name: tripmate-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/tripmate?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:Thiru@123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
