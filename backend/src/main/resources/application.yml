spring:
  application:
    name: tripmate-backend
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    show-sql: ${JPA_SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration

brevo:
  api-url: ${BREVO_API_URL:https://api.brevo.com/v3/smtp/email}
  api-key: ${TRIPMATE_BREVO_API_KEY:${BREVO_API_KEY:}}
  sender-email: ${TRIPMATE_BREVO_SENDER_EMAIL:${BREVO_SENDER_EMAIL:thirumuruganofficial3@gmail.com}}
  sender-name: ${TRIPMATE_BREVO_SENDER_NAME:${BREVO_SENDER_NAME:TripMate}}

app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:4200}
  cors-allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:${APP_FRONTEND_URL:http://localhost:4200}}

storage:
  r2:
    enabled: ${R2_ENABLED:false}
    endpoint: ${R2_ENDPOINT:}
    access-key-id: ${R2_ACCESS_KEY_ID:}
    secret-access-key: ${R2_SECRET_ACCESS_KEY:}
    bucket: ${R2_BUCKET:}
    presigned-url-expiration-seconds: ${R2_PRESIGNED_URL_EXPIRATION:3600}

discovery:
  nominatim-url: ${DISCOVERY_NOMINATIM_URL:https://nominatim.openstreetmap.org}
  photon-url: ${DISCOVERY_PHOTON_URL:https://photon.komoot.io}
  overpass-urls: ${DISCOVERY_OVERPASS_URLS:${DISCOVERY_OVERPASS_URL:https://overpass-api.de/api/interpreter,https://maps.mail.ru/osm/tools/overpass/api/interpreter,https://overpass.private.coffee/api/interpreter}}
  user-agent: ${DISCOVERY_USER_AGENT:TripMate/1.0 (+https://github.com/Thiru-Murugan3/TripMate)}
  connect-timeout-ms: ${DISCOVERY_CONNECT_TIMEOUT_MS:8000}
  read-timeout-ms: ${DISCOVERY_READ_TIMEOUT_MS:35000}
  cache-minutes: ${DISCOVERY_CACHE_MINUTES:60}
  static-cache-hours: ${DISCOVERY_STATIC_CACHE_HOURS:6}
  price-cache-minutes: ${DISCOVERY_PRICE_CACHE_MINUTES:60}
  geocode-cache-hours: ${DISCOVERY_GEOCODE_CACHE_HOURS:24}
  price-verification-days: ${DISCOVERY_PRICE_VERIFICATION_DAYS:30}
  max-results: ${DISCOVERY_MAX_RESULTS:200}
  wikipedia-url: ${DISCOVERY_WIKIPEDIA_URL:https://en.wikipedia.org}
  wikidata-url: ${DISCOVERY_WIKIDATA_URL:https://www.wikidata.org}
  geoapify:
    url: ${DISCOVERY_GEOAPIFY_URL:https://api.geoapify.com}
    api-key: ${DISCOVERY_GEOAPIFY_API_KEY:}

server:
  port: ${PORT:${SERVER_PORT:8080}}

jwt:
  secret: ${JWT_SECRET:dGhpcmlzYWRldjUzY3JldGtleWZvcnRyaXBtYXRlYXBwbG9jYWw=}
  access-token-expiration: ${JWT_ACCESS_EXPIRATION:900000}
  refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
