services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: tripmate
      MYSQL_USER: ${SERVICE_USER_MYSQL}
      MYSQL_PASSWORD: ${SERVICE_PASSWORD_64_MYSQL}
      MYSQL_ROOT_PASSWORD: ${SERVICE_PASSWORD_64_MYSQLROOT}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SERVER_PORT: "8080"
      DB_URL: "jdbc:mysql://mysql:3306/tripmate?createDatabaseIfNotExist=false&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      DB_USERNAME: ${SERVICE_USER_MYSQL}
      DB_PASSWORD: ${SERVICE_PASSWORD_64_MYSQL}
      JWT_SECRET: ${SERVICE_REALBASE64_64_JWT}
      JWT_ACCESS_EXPIRATION: "900000"
      JWT_REFRESH_EXPIRATION: "604800000"
      TRIPMATE_BREVO_API_KEY: ${TRIPMATE_BREVO_API_KEY:?Brevo API key is required}
      TRIPMATE_BREVO_SENDER_EMAIL: ${TRIPMATE_BREVO_SENDER_EMAIL:?Verified Brevo sender email is required}
      TRIPMATE_BREVO_SENDER_NAME: ${TRIPMATE_BREVO_SENDER_NAME:-TripMate}
      APP_FRONTEND_URL: ${SERVICE_URL_WEB_8080}
      APP_CORS_ALLOWED_ORIGINS: ${SERVICE_URL_WEB_8080}
      JPA_DDL_AUTO: validate
      JPA_SHOW_SQL: "false"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    expose:
      - "8080"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:8080/api/v1/health | grep -q UP"
        ]
      interval: 30s
      timeout: 5s
      retries: 8
      start_period: 60s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8080
      SERVICE_URL_WEB_8080: /
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "8080"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:8080/ >/dev/null"
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  mysql_data:
  uploads_data:
